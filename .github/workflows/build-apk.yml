name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk GIF-Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GIF-Studio-APK
          path: GIF-Studio.apk

      - name: Publish as a download (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GIF Studio (build ${{ github.run_number }})
          body: Download **GIF-Studio.apk** below and open it on your Android phone to install.
          files: GIF-Studio.apk
